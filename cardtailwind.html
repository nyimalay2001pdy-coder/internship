<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="bg-gray-100 min-h-screen flex justify-center p-8"
  >
    <div
      class="w-full max-w-5xl bg-gradient-to-r from-cyan-400 to-blue-600 p-8 flex flex-col md:flex-row justify-around gap-10 text-white"
    >
      <div class="w-full">
        <h2 class="text-3xl font-bold mb-6">Update Variables</h2>

        <div class="mb-4">
          <label class="block mb-1">Name</label>
          <input
            type="text"
            id="nameInput"
            value="Alex Walker"
            class="w-full p-2 rounded text-black outline-none"
          />
        </div>

        <div class="mb-4">
          <label class="block mb-1">Age</label>
          <input
            type="number"
            id="ageInput"
            value="28"
            class="w-full p-2 rounded text-black outline-none"
          />
        </div>

        <div class="flex flex-col justify-between gap-2">
          <label>VIP Status :</label>
          <input
            class="form-checkbox h-5 w-5 text-cyan-500"
            type="checkbox"
            id="vipInput"
            checked
          />
        </div>

        <div class="mb-4">
          <label class="block mb-2">Card Border Color</label>
          <input
            type="color"
            id="colorInput"
            value="#darkcyan"
            class="w-16 h-10 border-none cursor-pointer"
          />
        </div>
      </div>

      <div class="w-full md:w-1/2">
        <h2 class="text-3xl font-bold mb-6">Live DOM Output</h2>

        <div id="card" class="w-64 bg-white/20 rounded-xl p-5 shadow-lg">
          <span
            id="displayVip"
            class="font-bold text-cyan-200 bg-blue-900 px-2 rounded-full mb-4"
          >
            VIP MEMBER
          </span>
          <h3 id="displayName" class="text-2xl font-semibold mb-2">
            Alex Walker
          </h3>

          <p id="displayAge" class="mb-2">Age: 28</p>
        </div>
      </div>
    </div>

    <!-- <div
      class="w-full max-w-5xl bg-cyan-200 text-center py-3 font-bold text-gray-800"
    >
      Next Container
    </div> -->

    <script>
      const nameInput = document.getElementById("nameInput");
      const ageInput = document.getElementById("ageInput");
      const vipInput = document.getElementById("vipInput");
      const colorInput = document.getElementById("colorInput");

      const displayName = document.getElementById("displayName");
      const displayAge = document.getElementById("displayAge");
      const displayVip = document.getElementById("displayVip");
      const card = document.getElementById("card");

      function updateCard() {
        displayName.innerText = nameInput.value;
        displayAge.innerText = "Age:" + ageInput.value;
        if (vipInput.checked) {
          displayVip.textContent = "VIP MEMBER";
        } else {
          displayVip.textContent = "";
        }

        card.style.backgroundColor = colorInput.value;
      }

      nameInput.addEventListener("input", updateCard);
      ageInput.addEventListener("input", updateCard);
      vipInput.addEventListener("change", updateCard);
      colorInput.addEventListener("input", updateCard);

      updateCard();
    </script>
  </body>
</html>
