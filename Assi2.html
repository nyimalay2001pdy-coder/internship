<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <style>
    body {
        font-family: 'Times New Roman', Times, serif;
        background: #f4f4f4;
    }

    table {
        border-collapse: collapse;
        margin: 50px auto;
        width: 80%;
        background: #fff;
    }

    th, td {
        border: 1px solid #000;
        padding-left: 8px;
        padding-right: 10px;
         text-align: center; 
    }

    th {
        background-color: burlywood;
        font-weight: bold;
    }

    .left {
        text-align: left;
    }
    th.left{
        /* background-color: aliceblue; */
    }
    td:nth-child(5),
    td:nth-child(6),
     td:nth-child(7){
        text-align: right;
        
     }
     .right{
        text-align: right;
     }
    
</style>
</head>
<body>

<table>
    <tr>
        <th rowspan="2">No</th>
        <th rowspan="2">Student Name</th>
        <th rowspan="2">Gender</th>
        <th rowspan="2">Roll No.</th>
        <th colspan="3">Marks</th>
    </tr>
    <tr>
        <th class="left">Myanmar</th>
        <th class="left">English</th>
        <th class="left">Maths</th>
    </tr>

    <tr>
        <td>1</td>
        <td class="left">Su Su</td>
        <td rowspan="2">Female</td>
        <td class="left">5CS-32</td>
        <td>60</td>
        <td>75</td>
        <td>86</td>
    </tr>

    <tr>
        <td>2</td>
        <td class="left">Moe Moe</td>
        <td class="left">5CS-33</td>
        <td class="right">78</td>
        <td>86</td>
        <td>84</td>
    </tr>

    <tr>
        <td>3</td>
        <td class="left">Kyaw Kyaw</td>
        <td rowspan="3">Male</td>
        <td class="left">5CS-34</td>
        <td>89</td>
        <td>43</td>
        <td>86</td>
    </tr>

    <tr>
        <td>4</td>
        <td class="left">Mg Mg</td>
        <td class="left">5CS-35</td>
        <td class="right">76</td>
        <td>75</td>
        <td>75</td>
    </tr>

    <tr>
        <td>5</td>
        <td class="left">Aung Aung</td>
        <td class="left">5CS-36</td>
        <td class="right">87</td>
        <td>75</td>
        <td>86</td>
    </tr>
</table>  
</body>
</html>
