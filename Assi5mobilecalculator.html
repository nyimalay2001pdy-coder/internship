<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
 
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #e3f9ff;
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .calculator {
            width: min(100%, 420px);
            background: #0e1726;
            padding: 24px;
            border-radius: 32px;
            box-shadow: 0 24px 60px rgba(8, 21, 44, 0.25);
        }

        .calculator form {
            display: grid;
            gap: 20px;
        }

        .display {
            display: block;
        }

        .display input {
            width: 100%;
            height: 84px;
            border: none;
            border-radius: 24px;
            padding: 20px;
            font-size: 32px;
            color: #ffffff;
            background: #13203b;
            text-align: right;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
        }

        .buttons div {
            display: contents;
        }

        .buttons input {
            width: 100%;
            min-height: 72px;
            border: none;
            border-radius: 24px;
            background: #1f3159;
            color: #ffffff;
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        .buttons input:hover {
            transform: translateY(-1px);
        }

        .buttons input.operator {
            background: #2b8ee3;
            color: #f6fdff;
        }

        .buttons input#percent {
            background: #3a4d7b;
        }

        .buttons input.equal {
            grid-column: 1 / -1;
            background: #32d9a4;
            color: #08121d;
            font-weight: 700;
            min-height: 76px;
        }

        @media (max-width: 360px) {
            .calculator {
                padding: 18px;
            }

            .display input {
                height: 72px;
                font-size: 28px;
            }

            .buttons input {
                min-height: 64px;
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        
        <div class="calculator">
            <form onsubmit="return false;">
                <div class="display">
                    <input type="text" id="display" aria-label="Calculator display">
                </div>
                <div class="buttons">
                    <div>
                        <input type="button" value="C" id="clear" class="operator">
                        <input type="button" value="⌫" id="backspace" class="operator">
                        <input type="button" value="%" id="percent">
                        <input type="button" value="/" data-value="/" class="operator">
                    </div>
                    <div>
                        <input type="button" value="7" data-value="7">
                        <input type="button" value="8" data-value="8">
                        <input type="button" value="9" data-value="9">
                        <input type="button" value="*" data-value="*" class="operator">
                    </div>
                    <div>
                        <input type="button" value="4" data-value="4">
                        <input type="button" value="5" data-value="5">
                        <input type="button" value="6" data-value="6">
                        <input type="button" value="-" data-value="-" class="operator">
                    </div>
                    <div>
                        <input type="button" value="1" data-value="1">
                        <input type="button" value="2" data-value="2">
                        <input type="button" value="3" data-value="3">
                        <input type="button" value="+" data-value="+" class="operator">
                    </div>
                    <div>
                        <input type="button" value="0" data-value="0">
                        <input type="button" value="." data-value=".">
                        <input type="button" value="(" data-value="(">
                        <input type="button" value=")" data-value=")">
                    </div>
                    <input type="button" value="=" id="equals" class="equal">
                </div>
            </form>
        </div>
    </div>
    <script>

        const display = document.getElementById('display');
        const buttons = document.querySelectorAll('input[type="button"][data-value]');
        const clearButton = document.getElementById('clear');
        const backspaceButton = document.getElementById('backspace');
        const percentButton = document.getElementById('percent');
        const equalsButton = document.getElementById('equals');

        const formatResult = value => {
            if (value === Infinity || value === -Infinity || Number.isNaN(value)) {
                return "Can't divide by 0";
            }
            return String(value);
        };

        const safeEval = expression => {
            try {
                return formatResult(eval(expression));
            } catch {
                return 'Error';
            }
        };

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                display.value += button.dataset.value;
                // Number & Operator Buttons
buttons.forEach(button => {

  button.addEventListener('click', () => {

    const value = button.dataset.value;

    const lastChar = display.value.slice(-1);



    // Dot(.) နှစ်ခုမထပ်အောင်
    if(value === '.'){

      const lastNumber = display.value
        .split(/[+\-*/]/)
        .pop();

      if(lastNumber.includes('.')){
        return;
      }

    }



    // Operator (+ - * /) နှစ်ခုမထပ်အောင်
    if(
      ['+', '-', '*', '/'].includes(value) &&
      ['+', '-', '*', '/'].includes(lastChar)
    ){
      return;
    }



    // အစမှာ operator မရိုက်နိုင်
    if(
      display.value === '' &&
      ['+', '*', '/'].includes(value)
    ){
      return;
    }



    display.value += value;

  });

});
             });
        });

        clearButton.addEventListener('click', () => {
            display.value = '';
        });

        backspaceButton.addEventListener('click', () => {
            display.value = display.value.slice(0, -1);
        });

        percentButton.addEventListener('click', () => {
            display.value = safeEval(`${display.value}/100`);
        });

       equalsButton.addEventListener('click', () => {

            if (display.value.trim() === '') {
                display.value = '0';
                } else {
                    display.value = safeEval(display.value);
                        }

            });
    </script>
</body>
</html>
