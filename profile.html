<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="mx-auto w-1/5 rounded-lg flex flex-col justify-center gap-10 bg-blue-500 p-6">
        <div class="flex justify-center">
            <img class="w-20 block" src="profile.png" alt="profile"/>
        </div>
        <div class="text-center">
            <p class="text-white text-xl font-bold">John Developer</p>
            <p class="text-xs">Junior web developer</p>
        </div>
        <div class=" flex justify-between ">
            <p class="bg-yellow-300 rounded-lg px-2 text-xs">React</p>
            <p class="bg-green-300 rounded-lg px-2 text-xs">Tailwind CSS</p>
            <p class="bg-blue-300 rounded-lg px-2 text-xs">Node.js</p>
        </div>
        <button class="bg-gray-600 text-white rounded">Follow</button>
    </div>
</body>

</html>
