<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            height: 100vh;
            background: #e3f9ff;
            display: flex;
            align-items: center;
            justify-content: center;

        }

        .calculator {
            background: beige;
            padding: 20px;
            border-radius: 10px;
        }

        .calculator form input {
            border: 0;
            outline: 0;
            width: 50px;
            height: 40px;
            border-radius: 50px;
            background: black;
            font-size: 20px;
            color: lightcyan;
            cursor: pointer;
            margin: 10px;
        }

        form .display {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        form .display input {
            text-align: right; 
            flex: 1;
            font-size: 30px;
            box-shadow: none;
            width: 270px;
            height: 70px;
            border-radius: 1px;
        }

        form input.equal {
            width: 270px;
            border-radius: 30px;
        }

        form input.operator {
            color: #33ffd8;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="calculator">
            <form onsubmit="return false;">
                <div class="display">
                    <input type="text" id="display" aria-label="Calculator display">
                </div>
                <div class="buttons">
                    <div>
                        <input type="button" value="C" id="clear" class="operator">
                        <input type="button" value="⌫" id="backspace" class="operator">
                        <input type="button" value="%" id="percent">
                        <input type="button" value="/" data-value="/" class="operator">
                    </div>
                    <div>
                        <input type="button" value="7" data-value="7">
                        <input type="button" value="8" data-value="8">
                        <input type="button" value="9" data-value="9">
                        <input type="button" value="*" data-value="*" class="operator">
                    </div>
                    <div>
                        <input type="button" value="4" data-value="4">
                        <input type="button" value="5" data-value="5">
                        <input type="button" value="6" data-value="6">
                        <input type="button" value="-" data-value="-" class="operator">
                    </div>
                    <div>
                        <input type="button" value="1" data-value="1">
                        <input type="button" value="2" data-value="2">
                        <input type="button" value="3" data-value="3">
                        <input type="button" value="+" data-value="+" class="operator">
                    </div>
                    <div>
                        <input type="button" value="0" data-value="0">
                        <input type="button" value="." data-value=".">
                        <input type="button" value="(" data-value="(">
                        <input type="button" value=")" data-value=")">
                    </div>
                    <input type="button" value="=" id="equals" class="equal">
                </div>
            </form>
        </div>
    </div>
    <script>
        const display = document.getElementById('display');
        const buttons = document.querySelectorAll('input[type="button"][data-value]');
        const clearButton = document.getElementById('clear');
        const backspaceButton = document.getElementById('backspace');
        const percentButton = document.getElementById('percent');
        const equalsButton = document.getElementById('equals');

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                display.value += button.dataset.value;
            });
        });

        clearButton.addEventListener('click', () => {
            display.value = '';
        });

        backspaceButton.addEventListener('click', () => {
            display.value = display.value.slice(0, -1);
        });

        percentButton.addEventListener('click', () => {
            try {
                display.value = String(eval(display.value) / 100);
            } catch {
                display.value = 'Error';
            }
        });

        equalsButton.addEventListener('click', () => {
            try {
                display.value = String(eval(display.value));
            } catch {
                display.value = 'Error';
            }
        });
    </script>
</body>
</html>

</html>
